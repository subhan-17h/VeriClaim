# VeriClaim model routing.
#
# Tasks are routed to TIERS, not to models. This keeps the "which model does what"
# decision in one table instead of scattered across the codebase, and makes swapping
# a provider a one-line change.
#
# Cost is data, not code: usd_per_1m_input/output drive the gateway's cost accounting.
#
# COST POLICY (2026-08-11)
# -----------------------
# Gemini serves every tier on its free tier. OpenAI is registered as a fallback leg
# but every OpenAI entry is marked `paid: true`, and the ladder refuses paid rungs
# unless VC_ALLOW_PAID_FALLBACK=true. Normal operation therefore costs $0.00.
#
# This matters because Gemini signals free-tier exhaustion with HTTP 429, which is a
# legitimately transient error. Without the paid flag, exhausting the free quota would
# retry, fall through to OpenAI, and quietly start billing.
#
# rpm/rpd are Google's published free-tier limits (reduced 50-80% in Dec 2025). They
# are enforced client-side by gateway/quota.py so we self-throttle rather than
# generating the 429s that would push the ladder toward a paid provider. Limits apply
# per PROJECT, not per API key, and reset at midnight US/Pacific.

# MODEL AVAILABILITY (verified live 2026-08-11 against this project's key)
# ------------------------------------------------------------------------
# gemini-2.5-flash is listed by models.list() but returns 404 "no longer available to
# new users" when called. Listing does not imply usability, so these names were chosen
# by making a real call to each -- see scripts/verify_providers.py.
# gemini-2.5-pro and gemini-pro-latest returned 429 immediately: the pro free-tier
# allowance is far too small for this workload.
#
# THINKING TOKENS: Gemini 3.x models reason before answering, and those thoughts are
# billed against max_output_tokens. A 16-token budget produced 128 thought tokens and
# an EMPTY reply. The budgets below are deliberately generous for that reason. Setting
# thinking_budget=0 works on 3.5-flash but is rejected by 3.6-flash and flash-lite, so
# a generous budget is the portable fix rather than disabling thinking.
#
# PRICING: Gemini entries are priced at 0.0 because we are on the free tier and they
# genuinely cost nothing. Pricing them at their paid-tier rates would consume the spend
# ceiling that exists to protect a real prepaid OpenAI credit. Token counts are still
# recorded per model and per task, so cost awareness is not lost. Published paid rates
# are noted beside each entry for the write-up.
#
# RATE LIMITS: Google publishes limits for 2.5-series models; the 3.x figures are not
# documented, so the conservative 2.5 numbers are reused. Guessing low only means we
# throttle more than necessary, and the provider's own 429 remains the backstop.

tiers:
  # High-volume classification and routing. flash-lite has by far the largest daily
  # allowance, which is what makes ~25-30 full questions/day possible. Measured at
  # ~700ms, the fastest of the candidates.
  cheap:
    provider: gemini
    model: gemini-3.5-flash-lite
    usd_per_1m_input: 0.0      # free tier (paid rate would be ~0.10)
    usd_per_1m_output: 0.0     # free tier (paid rate would be ~0.40)
    paid: false
    rpm: 15
    rpd: 1000
    timeout_s: 30
    max_output_tokens: 2048

  # Structured generation where correctness matters but the task is well-scoped.
  mid:
    provider: gemini
    model: gemini-3.5-flash
    usd_per_1m_input: 0.0      # free tier (paid rate would be ~0.30)
    usd_per_1m_output: 0.0     # free tier (paid rate would be ~2.50)
    paid: false
    rpm: 10
    rpd: 250
    timeout_s: 90
    max_output_tokens: 4096

  # Planning, cross-source reasoning, final synthesis.
  strong:
    provider: gemini
    model: gemini-3.5-flash
    usd_per_1m_input: 0.0
    usd_per_1m_output: 0.0
    paid: false
    rpm: 10
    rpd: 250
    timeout_s: 120
    max_output_tokens: 8192

  # OCR escalation for scanned pages below the confidence floor. Gemini flash is
  # vision-capable, so degraded-page recovery stays free.
  vision:
    provider: gemini
    model: gemini-3.5-flash
    usd_per_1m_input: 0.0
    usd_per_1m_output: 0.0
    paid: false
    rpm: 10
    rpd: 250
    timeout_s: 150
    max_output_tokens: 4096

# Per-task tier assignment. Every gateway call names a task; an unknown task is an
# error, not a silent default, so a typo cannot quietly bill the strong tier.
tasks:
  # --- orchestrator ---
  understand: cheap
  route: cheap
  plan: strong
  sufficiency: mid
  synthesize: strong
  verify: strong
  # --- nl2sql subsystem ---
  sql_table_select: cheap
  sql_generator: mid
  sql_refiner: mid
  sql_unit_tester: mid
  sql_profiler: strong
  # --- documents ---
  query_rewrite: cheap
  ocr_vision: vision
  # --- evaluation (supplementary judge only) ---
  eval_judge: strong

# Fallback ladder. Free Gemini rungs come first; the paid OpenAI rung is last and is
# skipped entirely unless VC_ALLOW_PAID_FALLBACK=true. Every hop is recorded on the
# trace, including a hop that was refused.
# Free Gemini rungs first; the paid OpenAI rung is last and is skipped entirely unless
# VC_ALLOW_PAID_FALLBACK=true. gpt-4o-mini is the only paid model used anywhere, chosen
# because it is the cheapest capable option against a $1.00 prepaid credit.
fallback:
  cheap:
    - {provider: gemini, model: gemini-3.5-flash, usd_per_1m_input: 0.0, usd_per_1m_output: 0.0,
       paid: false, rpm: 10, rpd: 250, max_output_tokens: 4096}
    - {provider: openai, model: gpt-4o-mini, usd_per_1m_input: 0.15, usd_per_1m_output: 0.60,
       paid: true, max_output_tokens: 2048}
  mid:
    - {provider: gemini, model: gemini-3.5-flash-lite, usd_per_1m_input: 0.0, usd_per_1m_output: 0.0,
       paid: false, rpm: 15, rpd: 1000, max_output_tokens: 4096}
    - {provider: openai, model: gpt-4o-mini, usd_per_1m_input: 0.15, usd_per_1m_output: 0.60,
       paid: true, max_output_tokens: 4096}
  strong:
    - {provider: gemini, model: gemini-3.5-flash-lite, usd_per_1m_input: 0.0, usd_per_1m_output: 0.0,
       paid: false, rpm: 15, rpd: 1000, max_output_tokens: 4096}
    - {provider: openai, model: gpt-4o-mini, usd_per_1m_input: 0.15, usd_per_1m_output: 0.60,
       paid: true, max_output_tokens: 4096}
  vision:
    - {provider: openai, model: gpt-4o-mini, usd_per_1m_input: 0.15, usd_per_1m_output: 0.60,
       paid: true, max_output_tokens: 4096}

limits:
  # Transient-error retries against the SAME model before walking the fallback ladder.
  transient_retries: 2
  transient_backoff_s: 1.0
