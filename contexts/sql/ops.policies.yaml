useful_for:
- Counting policies in force, by product, region or period.
- Finding the terms - sum insured, deductible - that apply to a claim.
- Summing premium income by region or product.
- Checking whether a date of loss falls inside a policy's period of cover.
synonyms:
- term: policy reference
  maps_to: policy_number
- term: start date
  maps_to: inception_date
- term: renewal date
  maps_to: expiry_date
- term: excess
  maps_to: deductible_pkr
- term: coverage amount
  maps_to: sum_insured_pkr
joins:
- column: customer_id
  references: ops.customers.customer_id
  meaning: The policyholder who bought the policy.
- column: product_id
  references: ops.coverage_products.product_id
  meaning: The product whose wording governs the policy.
- column: region_id
  references: ops.regions.region_id
  meaning: The region the insured risk sits in.
cautions:
- A deductible is not a limit. deductible_pkr is what the insured bears on each claim and reduces
  what the insurer pays; sum_insured_pkr is the ceiling on the payout and is never itself paid. Summing
  sum_insured_pkr measures exposure, not cost.
- annual_premium_pkr is income and belongs to no claim. Never combine it with claim amounts in one
  total.
- A policy's status is administrative. It says nothing about whether any claim under it is payable;
  that is decided against the policy wording.
- Cover is a period, not a flag. A policy is in force for a given date when that date is between inception_date
  and expiry_date, regardless of status today.
invariants:
- kind: ordered
  lower: inception_date
  upper: expiry_date
  meaning: Cover cannot expire before it began.
- kind: non_negative
  column: sum_insured_pkr
  meaning: A ceiling on what is payable cannot be negative.
- kind: non_negative
  column: deductible_pkr
  meaning: The amount the insured bears cannot be negative.
- kind: non_negative
  column: annual_premium_pkr
  meaning: Premium is income received; it cannot be negative.
