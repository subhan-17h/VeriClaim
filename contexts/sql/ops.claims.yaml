# Hand-authored and reviewed. Statistics blocks are machine-refreshed by
# `uv run python scripts/refresh_contexts.py`; everything else is edited by a human.
schema: ops
table: claims
purpose: 'Every claim reported against a policy, one row per claim. This is the central table of the
  operational database: claim volumes, perils, regional patterns and cost all come from here. It carries
  two different dates and three different money columns, and choosing the wrong one of either produces
  a plausible answer to a different question.'
