useful_for:
- Counting claims reported in a period, by region, peril or product.
- Measuring claim cost, either incurred or paid, by any of those groupings.
- Comparing when losses occurred against when they were reported.
- Finding the claims a scanned inspection report or invoice belongs to.
- Identifying claims whose recorded cause suggests a sudden event or gradual damage.
synonyms:
- term: claim reference
  maps_to: claim_number
- term: claim number
  maps_to: claim_number
- term: filed
  maps_to: report_date
- term: notified
  maps_to: report_date
- term: loss date
  maps_to: date_of_loss
- term: cause of loss
  maps_to: peril
- term: cost
  maps_to: incurred_amount_pkr
- term: settled amount
  maps_to: paid_amount_pkr
- term: outstanding
  maps_to: reserve_amount_pkr
joins:
- column: policy_id
  references: ops.policies.policy_id
  meaning: The policy claimed against. Needed for the product, the deductible and the sum insured
    that apply.
- column: adjuster_id
  references: ops.adjusters.adjuster_id
  meaning: The adjuster handling the claim. Nullable, so an inner join drops unassigned claims.
- column: region_id
  references: ops.regions.region_id
  meaning: The region the loss occurred in.
cautions:
- date_of_loss and report_date are different questions. "Claims filed in March" means report_date;
  "losses that occurred in March" means date_of_loss. The two diverge whenever reporting is delayed,
  which is exactly when the difference matters.
- incurred_amount_pkr, paid_amount_pkr and reserve_amount_pkr are three different quantities. Incurred
  is the expected ultimate cost, paid is cash already out, reserve is what remains set aside, and
  incurred equals paid plus reserve. Summing more than one of them together double counts.
- A claim's status is a workflow state, not a coverage determination. A denied or withdrawn claim
  must never be reported as a decision this system reached, and a closed claim is not an approved
  one.
- peril and cause_description record what was reported at notification. A scanned inspection report
  may describe a different cause; where they disagree, both should be reported rather than one silently
  preferred.
- An inner join to adjusters drops claims with no adjuster assigned. Use a left join unless the question
  is specifically about assigned claims.
invariants:
- kind: sum
  total: incurred_amount_pkr
  parts:
  - paid_amount_pkr
  - reserve_amount_pkr
  meaning: Incurred is paid plus reserve. A total that does not add up almost always means the three
    columns were aggregated over different sets of rows, which a join can do invisibly.
- kind: ordered
  lower: paid_amount_pkr
  upper: incurred_amount_pkr
  meaning: Cash already paid can never exceed the expected ultimate cost.
- kind: non_negative
  column: incurred_amount_pkr
  meaning: An estimate of ultimate cost cannot be negative.
- kind: non_negative
  column: paid_amount_pkr
  meaning: Cash paid out on a claim cannot be negative. Money received back is a recovery, and is
    recorded in ops.claim_payments rather than here.
- kind: non_negative
  column: reserve_amount_pkr
  meaning: A reserve is money still set aside to be paid; it cannot be negative.
- kind: non_negative
  column: deductible_applied_pkr
  meaning: A deductible reduces what the insurer pays; it is never a credit.
- kind: ordered
  lower: date_of_loss
  upper: report_date
  meaning: A loss cannot be reported before it happened.
- kind: ordered
  lower: report_date
  upper: closed_date
  meaning: A claim cannot be closed before it was reported.
